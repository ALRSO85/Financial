global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [financial-alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: financial-backup
    static_configs:
      - targets: [financial-backup-metrics:9100]

  - job_name: financial-api-liveness
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: [/etc/prometheus/targets/api-liveness.yml]
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: financial-blackbox-exporter:9115

  - job_name: financial-api-readiness
    metrics_path: /probe
    params:
      module: [financial_ready]
    file_sd_configs:
      - files: [/etc/prometheus/targets/api-readiness.yml]
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: financial-blackbox-exporter:9115

  - job_name: financial-postgres-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: [host.docker.internal:5432]
        labels:
          service: write-database
      - targets: [host.docker.internal:5433]
        labels:
          service: read-database
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: financial-blackbox-exporter:9115
