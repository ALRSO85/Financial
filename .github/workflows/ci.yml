name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres-write:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: financial
          POSTGRES_USER: financial
          POSTGRES_PASSWORD: financial
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U financial -d financial"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      postgres-read:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: financial
          POSTGRES_USER: financial
          POSTGRES_PASSWORD: financial
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U financial -d financial"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      FinancialTests__PostgresConnectionString: Host=localhost;Port=5432;Database=financial;Username=financial;Password=financial
      FinancialTests__ReadPostgresConnectionString: Host=localhost;Port=5433;Database=financial;Username=financial;Password=financial
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Financial.sln
      - run: dotnet build Financial.sln --no-restore --configuration Release -warnaserror
      - run: dotnet test Financial.sln --no-build --configuration Release
