services:
  financial-write-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: financial
      POSTGRES_USER: financial
      POSTGRES_PASSWORD: financial-local-only
    ports:
      - "5432:5432"
    volumes:
      - financial-write-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financial -d financial"]
      interval: 5s
      timeout: 3s
      retries: 20

  financial-read-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: financial_read
      POSTGRES_USER: financial
      POSTGRES_PASSWORD: financial-local-only
    ports:
      - "5433:5432"
    volumes:
      - financial-read-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financial -d financial_read"]
      interval: 5s
      timeout: 3s
      retries: 20

  financial-observability:
    profiles: ["observability"]
    image: mcr.microsoft.com/aspire/dashboard:13.6.4
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:18888
      ASPIRE_DASHBOARD_OTLP_ENDPOINT_URL: http://0.0.0.0:18889
      ASPIRE_DASHBOARD_OTLP_HTTP_ENDPOINT_URL: http://0.0.0.0:18890
      Dashboard__ApplicationName: Financial.LocalDiagnostics
      Dashboard__Otlp__AuthMode: ApiKey
      Dashboard__Otlp__PrimaryApiKey: ${ASPIRE_DASHBOARD_OTLP_API_KEY:?Set ASPIRE_DASHBOARD_OTLP_API_KEY in .env}
      Dashboard__Api__Enabled: "true"
      Dashboard__Api__AuthMode: ApiKey
      Dashboard__Api__PrimaryApiKey: ${ASPIRE_DASHBOARD_API_KEY:?Set ASPIRE_DASHBOARD_API_KEY in .env}
      Dashboard__TelemetryLimits__MaxLogCount: "10000"
      Dashboard__TelemetryLimits__MaxTraceCount: "10000"
      Dashboard__TelemetryLimits__MaxMetricsCount: "10000"
    ports:
      - "${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:18888:18888"
      - "${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:4317:18889"
      - "${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:4318:18890"
    restart: unless-stopped

  financial-write-api:
    profiles: ["applications"]
    image: financial-write-api:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT_PATH: src/Financial.Api/Financial.Api.csproj
        APP_DLL: Financial.Api.dll
    environment:
      DOTNET_ENVIRONMENT: Development
      Financial__ApiRole: write
      Jwt__Issuer: financial-sandbox
      Jwt__Audience: financial-sandbox-api
      Jwt__SigningKey: ${FINANCIAL_JWT_SIGNING_KEY:-}
      ConnectionStrings__FinancialWrite: "Host=financial-write-db;Port=5432;Database=financial_write_monitoring;Username=financial_write_app;Password=${FINANCIAL_WRITE_DB_PASSWORD:-};Timeout=5;Command Timeout=30"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_HEADERS: "x-otlp-api-key=${ASPIRE_DASHBOARD_OTLP_API_KEY:-}"
    expose: ["8080"]
    extra_hosts:
      - "host.docker.internal:${MONITORING_HOST_ADDRESS:-host-gateway}"
    networks: [default, financial-database]
    restart: unless-stopped

  financial-read-api:
    profiles: ["applications"]
    image: financial-read-api:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT_PATH: src/Financial.Api/Financial.Api.csproj
        APP_DLL: Financial.Api.dll
    environment:
      DOTNET_ENVIRONMENT: Development
      Financial__ApiRole: read
      Jwt__Issuer: financial-sandbox
      Jwt__Audience: financial-sandbox-api
      Jwt__SigningKey: ${FINANCIAL_JWT_SIGNING_KEY:-}
      ConnectionStrings__FinancialRead: "Host=financial-read-db;Port=5432;Database=financial_read_monitoring;Username=financial_read_app;Password=${FINANCIAL_READ_DB_PASSWORD:-};Timeout=5;Command Timeout=30"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_HEADERS: "x-otlp-api-key=${ASPIRE_DASHBOARD_OTLP_API_KEY:-}"
    expose: ["8080"]
    extra_hosts:
      - "host.docker.internal:${MONITORING_HOST_ADDRESS:-host-gateway}"
    networks: [default, financial-database]
    restart: unless-stopped

  financial-projector:
    profiles: ["applications"]
    image: financial-projector:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT_PATH: src/Financial.Projector.Worker/Financial.Projector.Worker.csproj
        APP_DLL: Financial.Projector.Worker.dll
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__FinancialWrite: "Host=financial-write-db;Port=5432;Database=financial_write_monitoring;Username=financial_write_app;Password=${FINANCIAL_WRITE_DB_PASSWORD:-};Timeout=5;Command Timeout=30"
      ConnectionStrings__FinancialRead: "Host=financial-read-db;Port=5432;Database=financial_read_monitoring;Username=financial_read_app;Password=${FINANCIAL_READ_DB_PASSWORD:-};Timeout=5;Command Timeout=30"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_HEADERS: "x-otlp-api-key=${ASPIRE_DASHBOARD_OTLP_API_KEY:-}"
    extra_hosts:
      - "host.docker.internal:${MONITORING_HOST_ADDRESS:-host-gateway}"
    networks: [default, financial-database]
    restart: unless-stopped

  financial-blackbox-exporter:
    profiles: ["monitoring"]
    image: prom/blackbox-exporter:v0.29.1
    command: ["--config.file=/etc/blackbox_exporter/blackbox.yml"]
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro
    extra_hosts:
      - "host.docker.internal:${MONITORING_HOST_ADDRESS:-host-gateway}"
    restart: unless-stopped

  financial-prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.13.5
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    ports:
      - "${MONITORING_BIND_ADDRESS:-127.0.0.1}:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/targets:/etc/prometheus/targets:ro
      - financial-prometheus-data:/prometheus
    depends_on:
      - financial-blackbox-exporter
      - financial-alertmanager
    extra_hosts:
      - "host.docker.internal:${MONITORING_HOST_ADDRESS:-host-gateway}"
    restart: unless-stopped

  financial-alertmanager:
    profiles: ["monitoring"]
    image: prom/alertmanager:v0.34.2
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "${MONITORING_BIND_ADDRESS:-127.0.0.1}:9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - financial-alertmanager-data:/alertmanager
    restart: unless-stopped

volumes:
  financial-write-data:
  financial-read-data:
  financial-prometheus-data:
  financial-alertmanager-data:

networks:
  financial-database:
    external: true
    name: ${FINANCIAL_DATABASE_NETWORK:-financial-db_default}
