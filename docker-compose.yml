services:
  financial-write-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: financial
      POSTGRES_USER: financial
      POSTGRES_PASSWORD: financial-local-only
    ports:
      - "5432:5432"
    volumes:
      - financial-write-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financial -d financial"]
      interval: 5s
      timeout: 3s
      retries: 20

  financial-read-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: financial_read
      POSTGRES_USER: financial
      POSTGRES_PASSWORD: financial-local-only
    ports:
      - "5433:5432"
    volumes:
      - financial-read-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financial -d financial_read"]
      interval: 5s
      timeout: 3s
      retries: 20

  financial-observability:
    profiles: ["observability"]
    image: mcr.microsoft.com/aspire/dashboard:13.6.4
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:18888
      ASPIRE_DASHBOARD_OTLP_ENDPOINT_URL: http://0.0.0.0:18889
      ASPIRE_DASHBOARD_OTLP_HTTP_ENDPOINT_URL: http://0.0.0.0:18890
      Dashboard__ApplicationName: Financial.LocalDiagnostics
      Dashboard__Otlp__AuthMode: ApiKey
      Dashboard__Otlp__PrimaryApiKey: ${ASPIRE_DASHBOARD_OTLP_API_KEY:?Set ASPIRE_DASHBOARD_OTLP_API_KEY in .env}
      Dashboard__Api__Enabled: "true"
      Dashboard__Api__AuthMode: ApiKey
      Dashboard__Api__PrimaryApiKey: ${ASPIRE_DASHBOARD_API_KEY:?Set ASPIRE_DASHBOARD_API_KEY in .env}
      Dashboard__TelemetryLimits__MaxLogCount: "10000"
      Dashboard__TelemetryLimits__MaxTraceCount: "10000"
      Dashboard__TelemetryLimits__MaxMetricsCount: "10000"
    ports:
      - "${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:18888:18888"
      - "${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:4317:18889"
      - "${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:4318:18890"
    restart: unless-stopped

  financial-blackbox-exporter:
    profiles: ["monitoring"]
    image: prom/blackbox-exporter:v0.29.1
    command: ["--config.file=/etc/blackbox_exporter/blackbox.yml"]
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro
    extra_hosts:
      - "host.docker.internal:${MONITORING_HOST_ADDRESS:-host-gateway}"
    restart: unless-stopped

  financial-prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.13.5
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    ports:
      - "${MONITORING_BIND_ADDRESS:-127.0.0.1}:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/targets:/etc/prometheus/targets:ro
      - financial-prometheus-data:/prometheus
    depends_on:
      - financial-blackbox-exporter
      - financial-alertmanager
    extra_hosts:
      - "host.docker.internal:${MONITORING_HOST_ADDRESS:-host-gateway}"
    restart: unless-stopped

  financial-alertmanager:
    profiles: ["monitoring"]
    image: prom/alertmanager:v0.34.2
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "${MONITORING_BIND_ADDRESS:-127.0.0.1}:9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - financial-alertmanager-data:/alertmanager
    restart: unless-stopped

volumes:
  financial-write-data:
  financial-read-data:
  financial-prometheus-data:
  financial-alertmanager-data:
